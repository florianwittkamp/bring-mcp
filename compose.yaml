services:
  bring-mcp:
    image: bring-mcp:tunnel
    build:
      context: .
    env_file:
      - .env
    ports:
      - '127.0.0.1:${TUNNEL_UI_PORT:-8090}:8080'
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
