version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      all-dependencies:
        patterns:
          - '*'
    ignore:
      # TypeScript 7 is not yet supported by @typescript-eslint.
      - dependency-name: 'typescript'
        versions:
          - '>=7.0.0'
